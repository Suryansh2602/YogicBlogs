    <ellipse cx="149.5" cy="70.5" rx="12" ry="8.5" transform="rotate(45 149.5 70.5)"/>
    <ellipse cx="170" cy="120" rx="12" ry="8.5" transform="rotate(90 170 120)"/>
    <ellipse cx="149.5" cy="169.5" rx="12" ry="8.5" transform="rotate(135 149.5 169.5)"/>
    <ellipse cx="100" cy="190" rx="12" ry="8.5"/>
    <ellipse cx="50.5" cy="169.5" rx="12" ry="8.5" transform="rotate(45 50.5 169.5)"/>
    <ellipse cx="30" cy="120" rx="12" ry="8.5" transform="rotate(90 30 120)"/>
    <ellipse cx="50.5" cy="70.5" rx="12" ry="8.5" transform="rotate(135 50.5 70.5)"/>
  </g>
  <g fill="#1F2B5E">
