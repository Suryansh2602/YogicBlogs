    <ellipse cx="35.3" cy="93.2" rx="10" ry="3.2" transform="rotate(112.5 35.3 93.2)"/>
  </g>
  <!-- Orange accents above the ring's open ends -->
  <g fill="#F2A33A">
    <path d="M38 52 l7 -10 l3 12 z"/>
    <path d="M162 52 l-7 -10 l-3 12 z"/>
  </g>
  <!-- Stem and leaves (teal) -->
  <path d="M100 70 C104 92 101 110 99 128 C97 146 97 160 101 172" fill="none" stroke="#1C9AA0" stroke-width="5" stroke-linecap="round"/>
  <path d="M101 112 C104 96 116 88 130 88 C127 102 116 111 101 112 Z" fill="#1C9AA0"/>
