  <path d="M100 72 C118 72 130 60 130 42 C114 44 102 56 100 72 Z" fill="#F3A7B7"/>
  <path d="M100 72 C86 60 86 36 100 18 C114 36 114 60 100 72 Z" fill="#E8728F"/>
